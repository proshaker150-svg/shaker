plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lexomega.analyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lexomega.analyzer'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    implementation 'org.smali:dexlib2:2.5.2'
}
